<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataCouch – Car Mat Vision AI Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a121f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .video-wrapper {
      width: 100%;
      max-width: 960px;
      background: rgba(15, 30, 53, 0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .video-header {
      padding: 1.2rem 1.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f4f7ff;
    }

    .video-title {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .video-title span {
      color: #e05c2a;
      font-weight: 700;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020810;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: black;
    }

    .meta-tags {
      padding: 1.2rem 1.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .tag {
      font-size: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      color: #9aaec9;
      letter-spacing: 0.3px;
    }

    .back-link {
      color: #9aaec9;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .back-link:hover { color: white; }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <div class="video-header">
      <div class="video-title">
        <span>▶</span> Car Mat Vision AI · Production Line QA
      </div>
      <!-- Optional: link back to main page -->
      <a href="index.html" class="back-link">← Back to Case Study</a>
    </div>

    <div class="video-container">
      <!-- 
        Replace the src below with the actual path to your demo video file.
        For example: src="demo.mp4" or src="videos/carmat-demo.mp4"
      -->
      <video controls autoplay playsinline>
        <source src="Mat_Defect_phase_1 (1).mp4" type="video/mp4" />
        Your browser does not support the video tag.s
      </video>
    </div>

    <div class="meta-tags">
      <span class="tag">🏭 Car Mat Production Line</span>
      <span class="tag">🎯 Fault Detection at Vacuum Station</span>
      <span class="tag">⚡ NVIDIA Jetson Orin Nano</span>
      <span class="tag">📊 Live Operator Dashboard</span>
    </div>
  </div>
</body>
</html>
